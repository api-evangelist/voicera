name: Voicera
description: Voicera (legal name Rizio, Inc.) was a Mountain View, California AI company
  whose Enterprise Voice Assistant (EVA) joined meetings to transcribe conversations,
  capture highlights and decisions, and push action items into collaboration tools
  like Slack and Microsoft Teams. Backed by Battery Ventures, e.ventures, GGV Capital,
  and Greycroft, the company rebranded as Voicea and was acquired by Cisco (announced
  August 6, 2019); its transcription and voice-intelligence technology now powers
  Webex Assistant. Voicera no longer operates independently and publishes no public
  API surface - voicera.com is offline and voicea.com redirects to Cisco Webex.
